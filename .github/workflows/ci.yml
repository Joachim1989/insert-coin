name: CI

# Rien ne bloquait un build casse d'arriver sur main avant ce fichier.
# Meme verification qu'en local (npm test = lint + vitest), sur chaque push
# et chaque pull request, pour l'attraper avant qu'il n'atteigne main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # Le build de preview/racine (npm run build / build:preview) n'est
      # PAS lance ici expres : c'est un acte de publication volontaire,
      # jamais un effet de bord d'une CI. Cette CI ne fait que verifier.
