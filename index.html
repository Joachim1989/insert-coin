<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Insert Coin</title>
<style>
:root{
  --ink:#14110F; --paper:#F4F5F2; --slab:#FFFFFF;
  --go:#0A7D3E; --mid:#B86A00; --stop:#B3261E;
  --ui:#1B3FD1; --muted:#5C5952; --line:#DEDFDA;
  --cond:"Avenir Next Condensed","HelveticaNeue-CondensedBold","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.35;padding-bottom:96px;-webkit-text-size-adjust:100%}
:focus-visible{outline:3px solid var(--ui);outline-offset:2px}

header{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;
  padding:10px 12px 8px;padding-top:calc(10px + env(safe-area-inset-top))}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.brand h1{font-family:var(--cond);font-size:22px;font-weight:700;margin:0;letter-spacing:.5px;text-transform:uppercase}
.brand span{font-family:var(--mono);font-size:10px;color:#9C978E;letter-spacing:1px}
.searchrow{display:flex;gap:6px}
.searchwrap{position:relative;flex:1;min-width:0}
#q{width:100%;height:52px;border:0;border-radius:10px;padding:0 42px 0 14px;
  font-size:17px;font-family:var(--body);background:#fff;color:var(--ink)}
#clear{position:absolute;right:4px;top:6px;width:40px;height:40px;border:0;background:none;
  font-size:22px;color:var(--muted);cursor:pointer;border-radius:8px}
#cam{flex:0 0 52px;height:52px;border:0;border-radius:10px;background:var(--ui);color:#fff;
  font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  user-select:none;-webkit-user-select:none}
#cam:active{background:#16309F}
/* l'input reste dans le flux (jamais display:none) sinon iOS et les WebView bloquent l'ouverture */
#file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;border:0;padding:0;margin:-1px;
  clip:rect(0 0 0 0);clip-path:inset(50%)}
#file:focus-visible + #cam,#cam:focus-visible{outline:3px solid #fff;outline-offset:2px}
.photostat{display:none;margin-top:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.8px;
  text-transform:uppercase;color:#9C978E;align-items:center;gap:8px}
.photostat.on{display:flex}
.photostat img{width:34px;height:34px;object-fit:cover;border-radius:6px;flex:0 0 auto}
.photostat button{margin-left:auto;background:none;border:0;color:#E8E6E1;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;padding:8px}
.askrow{display:none;gap:6px;margin-top:7px}
.askrow.on{display:flex}
#price{flex:0 0 96px;height:46px;border:1px solid #46423C;background:transparent;color:#fff;
  border-radius:9px;padding:0 10px;font-size:15px;font-family:var(--body)}
#price::placeholder{color:#8C877F}
#ask{flex:1;height:46px;border:0;border-radius:9px;background:#fff;color:var(--ink);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;
  font-weight:700;cursor:pointer;padding:0 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#ask[disabled]{opacity:.45}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid #46423C;background:transparent;color:#E8E6E1;
  font-family:var(--mono);font-size:11px;letter-spacing:.6px;text-transform:uppercase;
  padding:9px 12px;border-radius:999px;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:#fff;font-weight:700}
.verdicts{display:flex;gap:6px;margin-top:7px}
.vf{flex:1;border:1px solid #46423C;background:transparent;border-radius:8px;padding:8px 4px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.5px;color:#E8E6E1;cursor:pointer;min-height:36px}
.vf[aria-pressed="true"]{color:#fff;font-weight:700}
.vf[data-v="R"][aria-pressed="true"]{background:var(--go);border-color:var(--go)}
.vf[data-v="N"][aria-pressed="true"]{background:var(--mid);border-color:var(--mid)}
.vf[data-v="L"][aria-pressed="true"]{background:var(--stop);border-color:var(--stop)}

.count{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;color:var(--muted);
  text-transform:uppercase;padding:10px 14px 4px}
.list{padding:0 10px}
.item{display:flex;align-items:stretch;background:var(--slab);border-radius:10px;
  margin-bottom:7px;overflow:hidden;cursor:pointer;border:1px solid var(--line)}
.item:active{transform:scale(.994)}
.slab{flex:0 0 86px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;padding:10px 4px}
.slab .num{font-family:var(--cond);font-weight:700;font-size:30px;line-height:.95;letter-spacing:-.5px}
.slab .cap{font-family:var(--mono);font-size:8.5px;letter-spacing:.9px;opacity:.85;margin-top:3px}
.R .slab{background:var(--go)} .N .slab{background:var(--mid)} .L .slab{background:var(--stop)}
.meat{flex:1;min-width:0;padding:11px 10px 11px 12px;display:flex;flex-direction:column;justify-content:center}
.name{font-weight:650;font-size:15.5px;letter-spacing:-.15px}
.sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.2px;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mult{font-weight:700;color:var(--ink)}
.check{display:none;padding:0 12px 13px 98px;background:var(--slab);border-radius:0 0 10px 10px;
  margin:-7px 0 7px;border:1px solid var(--line);border-top:0;font-size:14px;line-height:1.45}
.check.open{display:block}
.check b{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--muted);
  display:block;margin-bottom:3px;text-transform:uppercase}
.empty{text-align:center;padding:40px 24px;color:var(--muted);font-size:15px}

/* ---------- VERDICT IA ---------- */
#ai{padding:0 10px}
.aicard{background:var(--slab);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;margin-bottom:12px}
.aihead{display:flex;align-items:stretch;color:#fff}
.aihead.R{background:var(--go)} .aihead.N{background:var(--mid)} .aihead.L{background:var(--stop)}
.aihead .p{flex:0 0 108px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:14px 4px;border-right:1px solid rgba(255,255,255,.25)}
.aihead .p .num{font-family:var(--cond);font-weight:700;font-size:40px;line-height:.9}
.aihead .p .cap{font-family:var(--mono);font-size:9px;letter-spacing:1px;opacity:.9;margin-top:4px}
.aihead .t{flex:1;min-width:0;padding:14px 12px;display:flex;flex-direction:column;justify-content:center}
.aihead .t .v{font-family:var(--mono);font-size:10px;letter-spacing:1.6px;opacity:.9}
.aihead .t .o{font-family:var(--cond);font-size:23px;font-weight:700;line-height:1.05;margin-top:3px}
.aihead .t .r{font-family:var(--mono);font-size:11px;opacity:.92;margin-top:5px}
.aibody{padding:13px 14px 15px}
.aibody h4{font-family:var(--mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--muted);margin:0 0 7px;font-weight:400}
.aibody ul{margin:0 0 14px;padding-left:19px}
.aibody li{font-size:14.5px;line-height:1.45;margin-bottom:5px}
.saywrap{background:var(--paper);border-left:4px solid var(--ink);padding:10px 12px;
  font-size:15px;line-height:1.4;margin-bottom:12px;font-style:italic}
.aimeta{font-size:13px;color:var(--muted);line-height:1.4}
.aithumb{width:100%;max-height:170px;object-fit:cover;display:block}
.loading{background:var(--slab);border:1px solid var(--line);border-radius:12px;
  padding:24px;text-align:center;margin-bottom:12px}
.dots{font-family:var(--cond);font-size:26px;letter-spacing:3px;color:var(--ui)}
.loading p{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--muted);
  text-transform:uppercase;margin:8px 0 0}
.aifail{background:#fff;border:1px solid var(--line);border-left:4px solid var(--stop);
  border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:14.5px;line-height:1.45}
.dismiss{width:100%;border:0;background:transparent;color:var(--muted);font-family:var(--mono);
  font-size:10.5px;letter-spacing:1px;text-transform:uppercase;padding:10px;cursor:pointer}

nav{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;background:var(--ink);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:#E8E6E1;padding:14px 4px;min-height:58px;cursor:pointer;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;border-right:1px solid #2E2A26}
nav button:last-child{border-right:0}
nav button b{display:block;font-size:17px;font-family:var(--body);margin-bottom:3px;font-weight:400}

.scrim{position:fixed;inset:0;background:rgba(20,17,15,.55);z-index:50;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--paper);
  border-radius:16px 16px 0 0;max-height:86vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .22s ease;
  padding:0 16px calc(28px + env(safe-area-inset-bottom))}
.sheet.open{transform:translateY(0)}
.sheet h2{font-family:var(--cond);text-transform:uppercase;letter-spacing:.8px;font-size:20px;
  margin:0;padding:18px 0 12px;position:sticky;top:0;background:var(--paper);border-bottom:2px solid var(--ink)}
.sheet h3{font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--muted);margin:20px 0 8px}
.sheet p{margin:0 0 10px;font-size:15px;line-height:1.5}
.rule{display:flex;gap:11px;margin-bottom:11px;align-items:flex-start}
.rule i{flex:0 0 auto;font-family:var(--cond);font-style:normal;font-weight:700;font-size:14px;
  background:var(--ink);color:#fff;padding:3px 8px;border-radius:5px;letter-spacing:.5px;margin-top:1px}
.rule span{font-size:15px;line-height:1.45}
label.tick{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);
  font-size:15.5px;cursor:pointer;min-height:48px}
label.tick input{width:24px;height:24px;accent-color:var(--go);flex:0 0 auto}
label.tick input:checked + span{text-decoration:line-through;color:var(--muted)}
.warn{border-left:4px solid var(--stop);padding-left:11px;margin-bottom:12px;font-size:15px;line-height:1.45}
.closeSheet{width:100%;margin-top:20px;padding:15px;border:0;border-radius:10px;background:var(--ink);color:#fff;
  font-family:var(--mono);font-size:12px;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer}
/* ---------- CONFIANCE / PREUVES ---------- */
.conf{display:flex;align-items:center;gap:8px;padding:9px 14px;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;border-bottom:1px solid var(--line)}
.conf .cdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.conf.h{background:#EAF5EE;color:#0A5C30}.conf.h .cdot{background:var(--go)}
.conf.m{background:#FBF1E2;color:#7A4600}.conf.m .cdot{background:var(--mid)}
.conf.f{background:#FBEAE9;color:#8C1F19}.conf.f .cdot{background:var(--stop)}
.ident{font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--muted);
  background:var(--paper);border-radius:7px;padding:9px 11px;margin-bottom:13px}
ul.proof li{font-family:var(--mono);font-size:12.5px;line-height:1.5}
/* ---------- CAMÉRA EN DIRECT ---------- */
.camov{position:fixed;inset:0;z-index:70;background:#000;display:none;flex-direction:column}
.camov.on{display:flex}
.camov video{flex:1;width:100%;min-height:0;object-fit:cover;background:#000}
.cambar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:16px 22px calc(22px + env(safe-area-inset-bottom));background:#000}
.cambar button{background:none;border:0;color:#fff;font-family:var(--mono);font-size:11px;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;padding:12px;min-width:78px}
#shutter{width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.3);
  padding:0;min-width:0;cursor:pointer}
#shutter:active{transform:scale(.93)}
.camtip{position:absolute;top:calc(14px + env(safe-area-inset-top));left:16px;right:16px;
  color:#fff;font-family:var(--mono);font-size:11px;letter-spacing:.6px;text-align:center;
  background:rgba(0,0,0,.45);padding:9px;border-radius:8px}
.optbtn{display:flex;align-items:center;gap:13px;width:100%;background:var(--slab);
  border:1px solid var(--line);border-radius:11px;padding:15px 14px;margin-bottom:9px;
  font-size:15.5px;text-align:left;cursor:pointer;color:var(--ink);font-family:var(--body);min-height:58px}
.optbtn b{font-size:21px;font-weight:400;flex:0 0 auto}
.optbtn i{font-style:normal;display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.optbtn span{min-width:0}
.diag{font-family:var(--mono);font-size:11px;line-height:1.6;color:var(--muted);
  background:var(--slab);border:1px solid var(--line);border-radius:9px;padding:11px 12px;
  word-break:break-word;margin-top:6px}
.sheet{transition:none}.item:active{transform:none}.dots{animation:none!important}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.dots span{animation:pulse 1.1s infinite}
.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}
</style>
</head>
<body>

<header>
  <div class="brand"><h1>Insert&nbsp;Coin</h1><span>PIXEL PAPA · ARGUS DE TERRAIN</span></div>
  <div class="searchrow">
    <div class="searchwrap">
      <input id="q" type="search" placeholder="Nom de l'objet…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button id="clear" aria-label="Effacer">×</button>
    </div>
    <input id="file" type="file" accept="image/*">
    <button type="button" id="cam" aria-label="Photographier l'objet">📷</button>
  </div>
  <div class="photostat" id="photostat"></div>
  <div class="askrow" id="askrow">
    <input id="price" type="number" inputmode="decimal" placeholder="Prix €" aria-label="Prix demandé par le vendeur">
    <button id="ask">✨ Demander à Claude</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="verdicts" id="verdicts">
    <button class="vf" data-v="R" aria-pressed="false">Rafle</button>
    <button class="vf" data-v="N" aria-pressed="false">Négocie</button>
    <button class="vf" data-v="L" aria-pressed="false">Laisse</button>
  </div>
</header>

<div id="ai"></div>
<div class="count" id="count"></div>
<div class="list" id="list"></div>

<div class="camov" id="camov">
  <video id="video" playsinline muted autoplay></video>
  <div class="camtip">Cadre l'objet entier, étiquette ou dessous visible si possible</div>
  <div class="cambar">
    <button type="button" id="camclose">Annuler</button>
    <button type="button" id="shutter" aria-label="Prendre la photo"></button>
    <button type="button" id="camflip">Objectif</button>
  </div>
</div>

<nav>
  <button data-sheet="nego"><b>💬</b>Négo</button>
  <button data-sheet="pieges"><b>⚠️</b>Pièges</button>
  <button data-sheet="sac"><b>🎒</b>Sac</button>
  <button data-sheet="timing"><b>🕕</b>Timing</button>
  <button data-sheet="reglages"><b>🔑</b>Clé</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div id="sheetBody"></div>
<button class="closeSheet" onclick="closeSheet()">Fermer</button></div>

<script>
/* ============ BARÈME LOCAL (hors ligne) ============
   b = prix max à payer · r = revente réaliste · v = verdict · k = ce qu'on vérifie */
const CATS=[["jv","🎮 Jeux vidéo"],["vin","💿 Vinyles"],["tec","📻 Rétro-tech"],["jou","🧸 Jouets"],["soc","🎲 Société"],["car","🃏 Cartes"],["pop","✨ Pop culture"]];

const D=[
{c:"jv",n:"N64 — jeu complet en boîte",b:25,r:60,v:"R",k:"Boîte carton = ultra fragile. Cale intérieure présente ? Sans elle, −40 %.",s:"nintendo 64 n64 cib"},
{c:"jv",n:"N64 — cartouche seule",b:8,r:18,v:"N",k:"Souffle dans le connecteur devant lui : ça fait vendeur pressé, ça fait baisser.",s:"nintendo 64 loose"},
{c:"jv",n:"SNES — cartouche seule",b:6,r:15,v:"N",k:"Étiquette trop nette + vis cruciforme = repro. Nintendo utilise du 3,8 mm tri-wing.",s:"super nintendo snes famicom"},
{c:"jv",n:"SNES — jeu complet boîte + notice",b:25,r:60,v:"R",k:"La notice fait la moitié du prix. Ouvre la boîte avant de payer.",s:"super nintendo cib"},
{c:"jv",n:"Mega Drive — jeu boîtier plastique",b:5,r:12,v:"N",k:"Charnières cassées = −50 %. Vérifie la notice ET le cale-cartouche.",s:"sega megadrive genesis"},
{c:"jv",n:"Master System — cartouche",b:5,r:12,v:"N",k:"Peu de demande hors titres cultes. Groupe-les.",s:"sega master system"},
{c:"jv",n:"Dreamcast — jeu",b:8,r:22,v:"R",k:"Boîtier fin qui casse. Le disque GD-ROM se raye vite, incline-le vers le soleil.",s:"sega dreamcast dc"},
{c:"jv",n:"Dreamcast — console",b:40,r:100,v:"R",k:"Pile morte = normal, mais utilise-le pour négocier. Vérifie le tiroir qui s'ouvre.",s:"sega dreamcast console"},
{c:"jv",n:"GameCube — jeu CIB commun",b:12,r:28,v:"R",k:"Rayure circulaire concentrique = disque foutu. Notice souvent manquante.",s:"gamecube gc ngc nintendo"},
{c:"jv",n:"GameCube — Wind Waker, Mario Kart DD, Metroid",b:25,r:55,v:"R",k:"Vérifie que le bon disque est dans le bon boîtier, l'erreur est fréquente.",s:"gamecube zelda mario kart double dash metroid prime"},
{c:"jv",n:"GameCube — console complète",b:45,r:90,v:"R",k:"Carte mémoire incluse ? Elle vaut 15 € à elle seule. Teste les 4 ports manette.",s:"gamecube console ngc"},
{c:"jv",n:"Game Boy DMG d'origine",b:15,r:35,v:"R",k:"Écran sans lignes verticales mortes. Ouvre la trappe : corrosion des piles = poubelle.",s:"gameboy dmg game boy brique"},
{c:"jv",n:"Game Boy Color",b:15,r:35,v:"R",k:"Coque transparente jaunie = normal, ça se blanchit. Teste le son.",s:"gameboy color gbc"},
{c:"jv",n:"Game Boy Advance SP",b:25,r:60,v:"R",k:"Modèle AGS-101 (écran rétroéclairé) = double le prix. Regarde la référence au dos.",s:"gba sp advance ags"},
{c:"jv",n:"GBA — cartouche seule",b:7,r:16,v:"N",k:"Repro très répandues. La cartouche officielle a un logo Nintendo gravé en relief.",s:"game boy advance gba"},
{c:"jv",n:"GBA — jeu complet boîte + notice",b:20,r:45,v:"R",k:"Boîte carton fine, coins écrasés = −30 %.",s:"game boy advance gba cib"},
{c:"jv",n:"DS / 3DS — jeu loose",b:5,r:12,v:"N",k:"Cartouche DS sans boîtier : très peu de valeur sauf Pokémon.",s:"nintendo ds 3ds"},
{c:"jv",n:"3DS — console",b:30,r:70,v:"R",k:"New 3DS XL > 3DS classique. Stylet présent ? Écran du haut sans rayures ?",s:"3ds console new xl"},
{c:"jv",n:"Wii — jeu",b:1.5,r:4,v:"L",k:"Aucune valeur SAUF Xenoblade, The Last Story, Metroid Trilogy, Pandora's Tower.",s:"wii nintendo"},
{c:"jv",n:"Wii U — jeu",b:10,r:28,v:"R",k:"Sous-coté et en pleine montée. Prends tout ce que tu vois.",s:"wii u wiiu"},
{c:"jv",n:"Wii U — console 32 Go",b:45,r:110,v:"R",k:"Le GamePad doit s'allumer : sans lui la console est inutilisable, donc invendable.",s:"wii u console gamepad"},
{c:"jv",n:"PS1 — jeu boîtier cristal",b:4,r:12,v:"N",k:"Boîtier fissuré = la norme. La notice + la cale font le prix.",s:"playstation ps1 psx"},

let cat="all", vf=new Set(), term="", photo=null;

const $=id=>document.getElementById(id);
const chipsEl=$("chips");
chipsEl.innerHTML='<button class="chip" data-c="all" aria-pressed="true">Tout</button>'+
  CATS.map(([k,l])=>`<button class="chip" data-c="${k}" aria-pressed="false">${l}</button>`).join("");
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");

function render(){
  const t=norm(term.trim());
  const out=D.filter(d=>(cat==="all"||d.c===cat)&&(vf.size===0||vf.has(d.v))&&
    (!t||norm(d.n+" "+d.s+" "+d.k).includes(t)));
  $("count").textContent=out.length?out.length+" repère"+(out.length>1?"s":"")+" · moyennes de catégorie, pas des cotes":"";
  const list=$("list");
  if(!out.length){
    list.innerHTML='<div class="empty">Rien sous ce nom dans le barème local.<br>Appuie sur « Demander à Claude » au-dessus.</div>';
    return;
  }
  list.innerHTML=out.map((d,i)=>{
    const mult=d.b>0?Math.round(d.r/d.b*10)/10:0;
    const price=d.b>0?(d.b%1?d.b.toFixed(1):d.b)+"€":"NON";
    const cap=d.b>0?"MAX":"PASSE";
    const resale=d.b>0?`→ ${d.r}€`:"aucun marché";
    const mx=d.b>0?`<span class="mult">×${mult}</span>`:"";
    return `<div class="item ${d.v}" data-i="${i}" tabindex="0" role="button" aria-expanded="false">
      <div class="slab"><div class="num">${price}</div><div class="cap">${cap}</div></div>
      <div class="meat"><div class="name">${d.n}</div><div class="sub">${mx}<span>${resale}</span></div></div>
    </div><div class="check" id="k${i}"><b>Ce que tu vérifies</b>${d.k}</div>`;
  }).join("");
  list.querySelectorAll(".item").forEach(el=>{
    const go=()=>{const k=$("k"+el.dataset.i);el.setAttribute("aria-expanded",k.classList.toggle("open"))};
    el.addEventListener("click",go);
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}});
  });
}

chipsEl.addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  cat=b.dataset.c;
  chipsEl.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));
  render();window.scrollTo({top:0});
});
$("verdicts").addEventListener("click",e=>{
  const b=e.target.closest(".vf");if(!b)return;
  const v=b.dataset.v;
  if(vf.has(v)){vf.delete(v);b.setAttribute("aria-pressed","false")}
  else{vf.add(v);b.setAttribute("aria-pressed","true")}
  render();
});
$("q").addEventListener("input",e=>{term=e.target.value;syncAsk();render()});
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();askAI()}});
$("clear").addEventListener("click",()=>{
  term="";$("q").value="";photo=null;showPhotoStat();syncAsk();render();$("q").focus();
});

function syncAsk(){
  const has=term.trim().length>1||!!photo;
  $("askrow").classList.toggle("on",has);
  const label=photo?"✨ Analyser la photo":"✨ Demander : "+term.trim().slice(0,22);
  $("ask").textContent=has?label:"";
  $("ask").disabled=!has;
}

/* ============ PHOTO ============ */
/* ---- CAPTURE ----
   Le sélecteur de fichiers dépend de l'app hôte et reste souvent muet dans une vue web.
   On attaque donc d'abord par le flux caméra (getUserMedia), qui ne passe pas par lui.
   S'il est refusé, on propose explicitement les autres voies avec le motif du refus. */
let stream=null, facing="environment", lastErr=null;

$("cam").addEventListener("click",openCamera);

async function openCamera(){
  lastErr=null;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    lastErr={name:"NoAPI",message:"getUserMedia indisponible"};
    return openPhotoMenu();
  }
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:facing},width:{ideal:1600}},audio:false});
  }catch(err){
    lastErr=err;
    return openPhotoMenu();
  }
  const v=$("video");
  v.srcObject=stream;
  try{await v.play()}catch(e){}
  $("camov").classList.add("on");
}

function closeCamera(){
  $("camov").classList.remove("on");
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  $("video").srcObject=null;
}
$("camclose").addEventListener("click",closeCamera);
$("camflip").addEventListener("click",async()=>{
  facing=facing==="environment"?"user":"environment";
  closeCamera();openCamera();
});
$("shutter").addEventListener("click",()=>{
  const v=$("video");
  if(!v.videoWidth) return;
  const max=1100,sc=Math.min(1,max/Math.max(v.videoWidth,v.videoHeight));
  const cv=document.createElement("canvas");
  cv.width=Math.round(v.videoWidth*sc);cv.height=Math.round(v.videoHeight*sc);
  cv.getContext("2d").drawImage(v,0,0,cv.width,cv.height);
  photo=fromCanvas(cv);
  closeCamera();
  showPhotoStat();syncAsk();askAI();
});

function fromCanvas(cv){
  const url=cv.toDataURL("image/jpeg",.82);
  return {data:url.split(",")[1],media:"image/jpeg",url};
}

      <i>Marche toujours. Marque + modèle suffisent pour un verdict fiable.</i></span></button>
    <h3>Diagnostic</h3>
    <div class="diag">${camDiag()}</div>
    <p style="margin-top:14px;font-size:14px;color:var(--muted)">Ouvre plutôt le fichier dans Safari ou Chrome
    (et non dans une app) : la caméra y fonctionne dès que la page est servie en HTTPS.</p>`;
  $("optType").addEventListener("click",()=>{closeSheet();$("q").focus()});
  $("scrim").classList.add("open");$("sheet").classList.add("open");
}

function camDiag(){
  const L=[];
  L.push("Contexte sécurisé : "+(window.isSecureContext?"oui":"NON"));
  L.push("Protocole : "+location.protocol);
  L.push("API caméra : "+(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia?"présente":"ABSENTE"));
  L.push("Dans un cadre imbriqué : "+(window.self!==window.top?"oui":"non"));
  if(lastErr) L.push("Refus : "+(lastErr.name||"?")+" — "+(lastErr.message||""));
  return L.join("<br>");
}

$("file").addEventListener("change",e=>{

async function loadPhoto(f){
  if(!f||!f.type.startsWith("image/")){
    $("ai").innerHTML='<div class="aifail">Ce fichier n\'est pas une image.</div>';return;
  }
  try{photo=await shrink(f)}
  catch(err){
    photo=null;
    $("ai").innerHTML='<div class="aifail"><b>Lecture impossible.</b><br>Décris l\'objet au clavier, le verdict est presque aussi précis.</div>';
    return;
  }
  closeSheet();showPhotoStat();syncAsk();askAI();
}

function showPhotoStat(){
  const el=$("photostat");
  if(!photo){el.className="photostat";el.innerHTML="";return}
  el.className="photostat on";
  el.innerHTML=`<img src="${photo.url}" alt=""><span>Photo prête</span>
    <button type="button" id="unpin">Retirer</button>`;
  $("unpin").addEventListener("click",()=>{photo=null;showPhotoStat();syncAsk()});
}

function shrink(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=1100,sc=Math.min(1,max/Math.max(img.width,img.height));
        const cv=document.createElement("canvas");
        cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        const url=cv.toDataURL("image/jpeg",.82);
        res({data:url.split(",")[1],media:"image/jpeg",url});
      };
      img.onerror=()=>rej(new Error("image"));
      img.src=r.result;
    };
    r.onerror=()=>rej(new Error("read"));
    r.readAsDataURL(file);
  });
}

/* ============ CLAUDE ============
   Le barème local n'est PLUS envoyé comme référence de prix : c'était la cause des
   fausses cotes (Top Gun classé "OST" et hérité des 20 € de la moyenne de catégorie).
   Le moteur cherche désormais des prix de vente réels pour CE titre précis. */

const BRIEF=`Tu es l'argus de terrain d'un chineur belge (Hainaut / Nord de la France), en direct sur un stand de brocante. Le vendeur attend : sois bref et tranchant.

TA MISSION EST DE TROUVER LA COTE RÉELLE DE CET EXEMPLAIRE PRÉCIS, PAS UNE MOYENNE DE CATÉGORIE.

Méthode obligatoire :
1. IDENTIFIE au plus précis : titre exact, éditeur/label, année, référence de pressage ou de set, édition (originale / réédition / repress), zone (PAL, FR, US), variante.
2. CHERCHE SUR LE WEB les prix de vente réels de cet objet précis. Utilise l'outil de recherche, plusieurs fois si besoin. Sources à privilégier, dans cet ordre : Discogs (pour les disques : consulte les statistiques de vente, pas les prix demandés), eBay ventes terminées, Leboncoin, Vinted, Rakuten, PriceCharting (jeux vidéo).
3. DISTINGUE prix demandé et prix réellement obtenu. Un vendeur qui affiche 40 € depuis deux ans ne prouve rien. Base-toi sur ce qui s'est vendu.
4. JUGE LE TIRAGE. Un titre pressé à des millions d'exemplaires (grosses B.O., albums best-sellers, jeux à très gros tirage) ne vaut presque rien même si sa catégorie est habituellement rentable. Dis-le franchement. À l'inverse, un petit tirage ou une variante rare peut valoir dix fois la moyenne de sa catégorie.
5. N'INVENTE JAMAIS UN CHIFFRE. Si tes recherches ne donnent rien de solide, mets confiance "faible", annonce une fourchette large et dis-le dans "note". Une estimation prudente et honnête vaut mieux qu'un chiffre précis inventé : il va négocier avec.

Calcul :
- fourchetteBas / fourchetteHaut = les prix de vente réellement observés pour cet objet dans cet état.
- revente = ce qu'il en tirerait raisonnablement, lui, en vente entre particuliers en Belgique/France.
- prixMax = le maximum qu'il doit payer AUJOURD'HUI sur ce stand. Vise environ un tiers de la revente pour un objet destiné à la revente, jusqu'à la moitié si c'est une pièce désirable pour sa collection. Jamais au-dessus de la revente.
- verdict : "R" = prends, "N" = seulement sous prixMax, "L" = laisse.

Champs :
- preuves : 1 à 3 constats CHIFFRÉS issus de tes recherches, très courts, avec la source. Exemple : "Discogs : ventes autour de 4-6 €, plus de 3000 exemplaires en vente". C'est ce qui lui sert d'argument face au vendeur.
- confiance : "haute" si tu as trouvé des ventes réelles concordantes, "moyenne" si c'est indirect ou peu de données, "faible" si tu extrapoles.
- tirage : "massif", "courant", "limité" ou "inconnu".
- verifs : 1 à 3 points concrets, vérifiables en 10 secondes, main sur l'objet, propres à CET objet (référence à lire, pièce qui manque souvent, défaut typique).
- nego : une seule phrase naturelle en français parlé, qui s'appuie sur un fait vérifiable.

Réponds UNIQUEMENT avec cet objet JSON, sans texte autour, sans balises de code :
{"objet":"","identification":"","categorie":"","verdict":"R|N|L","prixMax":0,"revente":0,"fourchetteBas":0,"fourchetteHaut":0,"tirage":"","confiance":"","preuves":[""],"verifs":[""],"nego":"","note":""}`;

$("ask").addEventListener("click",askAI);

/* ============ MOTEUR GEMINI ============
   La clé API n'est PAS dans le code : elle est saisie dans l'onglet Clé et
   rangée dans le stockage du téléphone. Rien n'est publié avec le code. */
const KEY_STORE="insertcoin.gemini.key";
const MODEL_STORE="insertcoin.gemini.model";
const MODELS=["gemini-3.5-flash","gemini-2.5-flash","gemini-2.0-flash"];

const getKey=()=>{try{return localStorage.getItem(KEY_STORE)||""}catch(e){return ""}};
const getModel=()=>{try{return localStorage.getItem(MODEL_STORE)||MODELS[0]}catch(e){return MODELS[0]}};

async function askAI(){
  const t=term.trim();
  const pic=photo;
  if(!t&&!pic)return;

  const key=getKey();
  if(!key){openSheet("reglages");return}

  const p=$("price").value.trim();
  const aiEl=$("ai");
  aiEl.innerHTML=`<div class="loading"><div class="dots"><span>●</span><span>●</span><span>●</span></div>
    <p>${pic?"Identification puis recherche de la cote":"Recherche de la cote réelle"}…</p></div>`;
  window.scrollTo({top:0,behavior:"smooth"});

  let ask="";
  if(pic) ask+="Identifie l'objet sur la photo (lis toutes les mentions visibles : titre, label, references, annee, code-barres) puis cherche sa cote reelle. ";
  if(t) ask+=`L'objet : ${t}. `;
  if(p) ask+=`Le vendeur en demande ${p} EUR. Dis clairement dans "note" si c'est a prendre, a negocier ou a laisser a ce prix-la. `;
  ask+="Cherche sur le web avant de chiffrer.";

  const parts=[];
  if(pic) parts.push({inline_data:{mime_type:pic.media,data:pic.data}});
  parts.push({text:BRIEF+"\n\n"+ask});

  const body={
    contents:[{role:"user",parts}],
    generationConfig:{temperature:0.2,maxOutputTokens:1400, responseMimeType: "application/json"}
  };

  const model=getModel();
  try{
    const res=await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
      {method:"POST",
       headers:{"Content-Type":"application/json","x-goog-api-key":key},
       body:JSON.stringify(body)});

    if(!res.ok){
      let d="";try{d=(await res.json()).error?.message||""}catch(e){}
      throw new Error("HTTP "+res.status+(d?" — "+d:""));
    }
    const data=await res.json();
    const raw=((data.candidates||[])[0]?.content?.parts||[])
      .map(x=>x.text||"").join("\n").replace(/```json|```/g,"").trim();
    const a=raw.indexOf("{"), b=raw.lastIndexOf("}");
    if(a<0||b<a) throw new Error("Réponse illisible");
    showAI(JSON.parse(raw.slice(a,b+1)),p,pic);
    photo=null;showPhotoStat();syncAsk();
  }catch(err){
    const m=String(err.message||err);
    let aide="Vérifie ta connexion et réessaie.";
    if(/401|403|API_KEY|PERMISSION/i.test(m)) aide="Ta clé est refusée. Recolle-la dans l'onglet Clé.";
    else if(/429|quota|RESOURCE_EXHAUSTED/i.test(m)) aide="Quota gratuit atteint pour l'instant. Réessaie dans quelques minutes.";
    else if(/404|not found|NOT_FOUND/i.test(m)) aide="Ce modèle n'existe plus. Change de modèle dans l'onglet Clé.";
    aiEl.innerHTML=`<div class="aifail"><b>Pas de réponse.</b><br>${aide}
      <br><span style="font-family:var(--mono);font-size:11px;color:var(--muted)">${esc(m)}</span><br><br>
      Le barème local en dessous marche sans réseau — cherche « ${esc(t||"lego, ampli, holo…")} ».</div>
      <button class="dismiss" onclick="document.getElementById('ai').innerHTML=''">Masquer</button>`;
  }
}

const esc=s=>String(s==null?"":s).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));

function showAI(j,askedPrice,pic){
  const v=["R","N","L"].includes(j.verdict)?j.verdict:"N";
  const label={R:"RAFLE",N:"NÉGOCIE",L:"LAISSE"}[v];
  const max=Number(j.prixMax)||0;
  const rev=Number(j.revente)||0;
  const lo=Number(j.fourchetteBas)||0, hi=Number(j.fourchetteHaut)||0;

  const conf=(j.confiance||"").toLowerCase();
  const cKey=conf.startsWith("haut")?"h":conf.startsWith("moy")?"m":"f";
  const cTxt={h:"Cote vérifiée",m:"Cote partielle",f:"Estimation non vérifiée"}[cKey];

  const tir=(j.tirage||"").toLowerCase();
  const tirTxt=tir.startsWith("mass")?"Tirage massif — ça se trouve partout"
    :tir.startsWith("limit")?"Tirage limité — c'est ce qui fait le prix"
    :tir.startsWith("cour")?"Tirage courant":"";

  const flag=askedPrice&&max?(Number(askedPrice)<=max
      ?`<span style="color:var(--go);font-weight:700">Sous ton plafond</span>`
      :`<span style="color:var(--stop);font-weight:700">Au-dessus de ton plafond</span>`):"";
  const preuves=(Array.isArray(j.preuves)?j.preuves:[]).filter(Boolean);
  const verifs=(Array.isArray(j.verifs)?j.verifs:[]).filter(Boolean);

  const range=lo&&hi?`ventes observées ${lo}–${hi}€`:rev?`revente ≈ ${rev}€`:"cote non trouvée";

  $("ai").innerHTML=`<div class="aicard">
    ${pic?`<img class="aithumb" src="${pic.url}" alt="Objet photographié">`:""}
    <div class="aihead ${v}">
      <div class="p"><div class="num">${max?max+"€":"—"}</div><div class="cap">TON MAX</div></div>
      <div class="t"><div class="v">${label}</div><div class="o">${esc(j.objet)}</div>
      <div class="r">${range}${max&&rev?" · ×"+(Math.round((rev/max)*10)/10):""}</div></div>
    </div>
    <div class="conf ${cKey}"><span class="cdot"></span>${cTxt}${tirTxt?" · "+tirTxt:""}</div>
    <div class="aibody">
      ${j.identification?`<div class="ident">${esc(j.identification)}</div>`:""}
      ${preuves.length?`<h4>Sur quoi ça repose</h4><ul class="proof">${preuves.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
      ${verifs.length?`<h4>Vérifie maintenant</h4><ul>${verifs.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
      ${j.nego?`<h4>Ce que tu dis</h4><div class="saywrap">« ${esc(j.nego)} »</div>`:""}
      ${j.note||flag?`<div class="aimeta">${flag?flag+" — ":""}${esc(j.note)}</div>`:""}
    </div>
  </div>
  <button class="dismiss" onclick="document.getElementById('ai').innerHTML=''">Masquer ce verdict</button>`;
}

/* ============ FICHES ============ */
const SHEETS={
nego:{t:"Négocier",h:`
<h3>La mécanique</h3>

<div class="rule"><i>2</i><span>Groupe toujours : « je prends ces quatre-là, 20 € et c'est fait » marche mieux que quatre marchandages.</span></div>
<div class="rule"><i>3</i><span>Espèces, petites coupures, montant exact déjà en main. Un billet tendu conclut une hésitation.</span></div>
<div class="rule"><i>4</i><span>Visage neutre, même sur une pépite. Dès que tu t'illumines, le prix se fige.</span></div>
<div class="rule"><i>5</i><span>Un seul chiffre, puis tu te tais. Le silence fait le travail à ta place.</span></div>
<div class="rule"><i>6</i><span>Repose l'objet, remercie, fais deux pas. La moitié du temps il te rappelle.</span></div>
<h3>Phrases qui marchent</h3>

<h3>Ce qui ne marche pas</h3>

pieges:{t:"Pièges",h:`
<div class="warn"><b>Cartouches repro.</b> Étiquette trop nette, couleurs saturées, vis cruciforme. Nintendo utilise du tri-wing 3,8 mm. Le plastique d'origine est mat, jamais brillant.</div>

reglages:{t:"Clé Gemini",h:`
<h3>Ta clé API</h3>

<input id="keyIn" type="password" placeholder="Colle ta clé ici" autocomplete="off" spellcheck="false"
  style="width:100%;height:50px;border:1px solid var(--line);border-radius:10px;padding:0 13px;font-size:15px;font-family:var(--mono);margin-bottom:9px">
<div style="display:flex;gap:8px;margin-bottom:6px">

const TICKS=["Espèces en petites coupures","Sacs solides ou cabas pliables","Téléphone chargé (l'IA en dépend)","Batterie externe","Piles AA et AAA pour tester","Chiffon microfibre","Mètre ruban","Papier bulle ou vieux journaux","Sac à dos rigide pour le fragile","Bouteille d'eau"];

function openSheet(k){
  const s=SHEETS[k];
  $("sheetBody").innerHTML=`<h2>${s.t}</h2>${s.h}`;
  if(k==="sac") $("ticks").innerHTML=TICKS.map(t=>
    `<label class="tick"><input type="checkbox"><span>${t}</span></label>`).join("");
  if(k==="reglages") wireSettings();
  $("scrim").classList.add("open");$("sheet").classList.add("open");
}
function closeSheet(){$("scrim").classList.remove("open");$("sheet").classList.remove("open")}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>openSheet(b.dataset.sheet)));
$("scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

function wireSettings(){
  const cur=getKey();
  $("keyIn").value=cur;
  paintKeyState();
  $("keySave").addEventListener("click",()=>{
    const v=$("keyIn").value.trim();
    try{v?localStorage.setItem(KEY_STORE,v):localStorage.removeItem(KEY_STORE)}catch(e){}
    paintKeyState();
  });
  $("keyDel").addEventListener("click",()=>{
    try{localStorage.removeItem(KEY_STORE)}catch(e){}
    $("keyIn").value="";paintKeyState();
  });
  const mc=getModel();
  $("modelPick").innerHTML=MODELS.map(m=>
    `<label class="tick"><input type="radio" name="mdl" value="${m}" ${m===mc?"checked":""}><span>${m}</span></label>`).join("");
  $("modelPick").addEventListener("change",e=>{
    if(e.target.name==="mdl"){try{localStorage.setItem(MODEL_STORE,e.target.value)}catch(err){}}
  });
}
function paintKeyState(){
  const k=getKey();
  $("keyState").innerHTML=k
    ? `Clé enregistrée · ${k.length} caractères · se termine par …${esc(k.slice(-4))}`
    : "Aucune clé enregistrée — l'analyse IA est désactivée, le barème local fonctionne.";
}

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

render();
